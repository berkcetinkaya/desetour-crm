# Exchange Rates Scheduled Fetch
# ─────────────────────────────────────────────────────────────────────────
# Calls the already-protected api/cron-fetch-exchange-rates.js endpoint
# every business day, so the Dashboard's "Bu Ay Beklenen Ciro" (which
# converts EUR/USD/GBP reservations with the newest ECB rate and refuses
# rates older than 7 days) always has a fresh EUR->TRY/USD->TRY/GBP->TRY
# cache to read from. The endpoint is the ONLY writer of exchange_rates. No FX logic lives
# in this file — its entire job is one authenticated HTTP request; the
# ECB feed fetch, parsing, cross-rate computation, and the write to
# exchange_rates all live in the endpoint itself.
#
# IMPORTANT — the schedule below is INERT until merged to the
# repository's default branch (GitHub only runs `schedule:` from there),
# same caveat as civitatis-scheduled-ingestion.yml.
#
# IDEMPOTENT: the endpoint upserts on UNIQUE(rate_date, base_currency,
# quote_currency). A re-run, or a run on an ECB holiday when the feed
# still carries the previous publication, rewrites the same rows (only
# fetched_at changes) — never a duplicate row.
#
# SECRETS: FX_SCHEDULER_SECRET (below) is a GitHub Actions encrypted
# secret. The same value must separately be set as the
# FX_SCHEDULER_SECRET environment variable on the Vercel deployment this
# workflow targets. FX_CRON_URL is a repository VARIABLE (a plain HTTPS
# endpoint URL, no embedded credential) set to the deployed endpoint's
# full URL, e.g. https://<your-production-domain>/api/cron-fetch-exchange-rates
# — neither is set by this change.
# ─────────────────────────────────────────────────────────────────────────
name: Exchange Rates Scheduled Fetch

on:
  # Live FX is used by the Dashboard's monthly revenue (Civitatis
  # settlement still uses its own fixed operational rate and does not
  # read this table). The ECB publishes around 16:00 CET (14:00–15:00
  # UTC depending on DST); 15:30 UTC Mon–Fri is after that window all
  # year round. FX_CRON_URL and FX_SCHEDULER_SECRET MUST be configured
  # before this is merged to the default branch, or every scheduled run
  # fails at the guard step below.
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: exchange-rates-scheduled-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected exchange-rate fetch endpoint
        env:
          SCHEDULER_SECRET: ${{ secrets.FX_SCHEDULER_SECRET }}
          FETCH_URL: ${{ vars.FX_CRON_URL }}
        run: |
          set -euo pipefail

          if [ -z "${FETCH_URL}" ]; then
            echo "::error::FX_CRON_URL repository variable is not set — see the activation instructions."
            exit 1
          fi
          if [ -z "${SCHEDULER_SECRET}" ]; then
            echo "::error::FX_SCHEDULER_SECRET repository secret is not set — see the activation instructions."
            exit 1
          fi

          http_status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 30 \
            -X GET \
            -H "Authorization: Bearer ${SCHEDULER_SECRET}" \
            "${FETCH_URL}")

          echo "HTTP status: ${http_status}"
          echo "Response body:"
          cat response.json

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::error::Exchange-rate fetch endpoint returned a non-2xx status (${http_status})"
            exit 1
          fi
