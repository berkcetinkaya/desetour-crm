<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Theme bootstrap — runs synchronously before anything paints, so the
       stored/system theme preference applies immediately instead of a
       flash of the other theme once DeseTourDashboard.jsx's own style
       tag (which defines the actual --c-* variables) mounts and its
       useTheme() effect fires. Mirrors useTheme()'s own read exactly. -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('dese_theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Dese Tour Operasyon Merkezi — CRM"/>
  <title>Dese Tour Operasyon Merkezi</title>

  <!-- Favicon — cropped from the existing dese-logo-mark.png brand asset
       (the "D" glyph, a plain crop with no redrawing/recoloring), never a
       generated or external image. -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

  <!--
  ══════════════════════════════════════════════════════════════════════
  DESE TOUR OPERATIONS CENTER — index.html
  Sprint 16 · Production Ready Template

  SETUP INSTRUCTIONS:
  1. Replace YOUR_PROJECT_REF and YOUR_ANON_KEY below with real values.
  2. Set USE_RESEND=true when Resend is configured (after EMAIL_SETUP.md).
  3. For npm/Vite setup, see the "npm option" section below.
  ══════════════════════════════════════════════════════════════════════
  -->

  <!-- ── Google Fonts ──────────────────────────────────────────────────
       Geist (operational UI, almost everywhere) + Instrument Serif
       (major page titles / selected editorial headings only) + DM Mono
       (numeric/technical, unchanged). Playfair Display + DM Sans stay
       loaded at a reduced weight set too, but ONLY for ProposalTemplate/
       ProposalPreviewModal (the printable customer quote document) and
       the Resend HTML email template (which actually carries its own
       independent @import and doesn't need this one) — both are
       deliberately left on the old pairing as a self-contained branded
       document, not part of the operational UI this phase retypefaces.
       Real Google Fonts family names: "Geist" (not "Geist Sans") and
       "Instrument Serif" (weight 400 only, italic + normal). -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: 'Geist', -apple-system, Helvetica, Arial, sans-serif; }
    #root { height: 100%; }

    /* ── Branded loader (.dt-loader) ─────────────────────────────────
       ONE definition shared by the static #boot-screen below (shown
       while scripts download) and React's <BrandLoader/> in
       DeseTourDashboard.jsx (shown while AuthGuard resolves the session
       / MFA state). It has to live here rather than in App's own <style>
       because AuthGuard renders it before that style tag mounts — and
       before the --c-* theme variables exist — so colors are literals
       keyed off html[data-theme], which the bootstrap script above sets
       before first paint. Same transparent dese-logo-mark.png as the
       sidebar: true colors in light, the white silhouette in dark. */
    .dt-loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #F5F4F0;
      font-family: 'Geist', -apple-system, Helvetica, Arial, sans-serif;
    }
    .dt-loader__inner {
      display: flex; flex-direction: column; align-items: center;
      animation: dtLoaderIn .7s cubic-bezier(.2,.7,.2,1) both;
    }
    .dt-loader__inner--static { animation: none; }
    .dt-loader__mark { position: relative; width: min(220px, 60vw); }
    .dt-loader__logo { display: block; width: 100%; height: auto; }
    /* A narrow gold glint that sweeps across the wordmark only — the logo
       itself is the mask, so it never paints outside the letterforms. Gold
       (not white) in both themes: a white band over the navy letters read
       as the logo fading, not shining. */
    .dt-loader__sheen {
      position: absolute; inset: 0; pointer-events: none;
      -webkit-mask: url("/dese-logo-mark.png") center / 100% 100% no-repeat;
              mask: url("/dese-logo-mark.png") center / 100% 100% no-repeat;
      background: linear-gradient(105deg, transparent 44%, rgba(201,168,76,0.95) 50%, transparent 56%);
      background-size: 250% 100%;
      animation: dtLoaderSheen 2.6s ease-in-out infinite;
      animation-delay: var(--dt-sync, 0ms);
    }
    .dt-loader__track {
      position: relative; overflow: hidden;
      width: 132px; height: 2px; border-radius: 2px; margin-top: 30px;
      background: rgba(184,151,58,0.18);
    }
    .dt-loader__bar {
      position: absolute; top: 0; bottom: 0; left: 0; width: 40%;
      border-radius: 2px; background: #B8973A;
      animation: dtLoaderBar 1.6s ease-in-out infinite;
      animation-delay: var(--dt-sync, 0ms);
    }
    .dt-loader__caption {
      margin-top: 14px; font-size: 10px; font-weight: 500;
      letter-spacing: .18em; text-transform: uppercase; color: #8A8070;
    }
    html[data-theme="dark"] .dt-loader { background: #121722; }
    html[data-theme="dark"] .dt-loader__logo { filter: brightness(0) invert(1); }
    html[data-theme="dark"] .dt-loader__track { background: rgba(201,168,76,0.18); }
    html[data-theme="dark"] .dt-loader__bar { background: #C9A84C; }
    html[data-theme="dark"] .dt-loader__caption { color: #99A0B2; }
    @keyframes dtLoaderIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes dtLoaderSheen { from { background-position: 150% 0; } to { background-position: -50% 0; } }
    @keyframes dtLoaderBar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      .dt-loader__inner, .dt-loader__sheen, .dt-loader__bar { animation: none; }
      .dt-loader__sheen { display: none; }
      .dt-loader__bar { left: 30%; }
    }

    /* Static boot screen = the same loader, pinned above everything until
       React has rendered something into #root (see the script at the end
       of <body>). */
    #boot-screen { z-index: 9999; transition: opacity .4s ease; }
    #boot-screen.hidden { opacity: 0; pointer-events: none; }
    /* window.onerror below swaps the loader for a white-on-navy error
       message — keep that readable regardless of theme. */
    #boot-screen.boot-error { background: linear-gradient(135deg, #0D1B3E 0%, #1B2D4F 60%, #2C3E6B 100%); }
  </style>

  <style>
    /* Responsive table — hidden on mobile, shown on desktop */
    .rsp-table { width: 100%; border-collapse: collapse; }
    @media (max-width: 767px) {
      .rsp-table { display: none !important; }
      .rsp-cards  { display: block !important; }
    }
    @media (min-width: 768px) {
      .rsp-table  { display: table !important; }
      .rsp-cards  { display: none !important; }
    }
    /* Mobile page header — stack vertically */
    @media (max-width: 767px) {
      .page-header { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
      .page-header-actions { width: 100%; justify-content: space-between; }
    }
    /* Modal responsive */
    @media (max-width: 767px) {
      .modal-inner { max-width: 100% !important; max-height: 95vh !important; margin: 0 !important; border-radius: 16px 16px 0 0 !important; }
    }
    /* Animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade { animation: fadeInUp 0.18s ease; }
  </style>
</head>
<body>

  <!-- Boot loading screen — same markup as React's <BrandLoader/> -->
  <div id="boot-screen" class="dt-loader" role="status" aria-live="polite" aria-label="Yükleniyor">
    <div class="dt-loader__inner">
      <div class="dt-loader__mark">
        <img class="dt-loader__logo" src="/dese-logo-mark.png" alt="Dese Tour"/>
        <span class="dt-loader__sheen" aria-hidden="true"></span>
      </div>
      <div class="dt-loader__track" aria-hidden="true"><span class="dt-loader__bar"></span></div>
      <div class="dt-loader__caption">Operasyon Merkezi yükleniyor</div>
    </div>
  </div>
  <script>
    // Lets <BrandLoader/> phase-sync its animations with this screen so
    // the cross-fade between the two is invisible.
    window.__DT_BOOT_T0 = (window.performance && performance.now()) || 0;
  </script>

  <!-- React root -->
  <div id="root"></div>

  <!--
  ══════════════════════════════════════════════════════════════════════
  CONFIGURATION — window.__DESE_CONFIG
  ══════════════════════════════════════════════════════════════════════
  Replace placeholder values before deploying.
  This block is the ONLY place secrets are configured for the CDN build.
  For a Vite build, use .env.local instead (see npm option below).

  NEVER commit real keys to version control.
  ══════════════════════════════════════════════════════════════════════
  -->
  <script>
    // Catch any JS errors and show them instead of blank screen
    window.onerror = function(msg, src, line, col, err) {
      var boot = document.getElementById('boot-screen');
      if (boot) {
        boot.classList.add('boot-error');
        boot.innerHTML = '<div style="padding:40px;color:#fff;font-family:monospace;font-size:13px;max-width:800px;margin:0 auto">' +
          '<div style="color:#C9A84C;font-size:16px;margin-bottom:16px">Dese Tour — Yükleme Hatası</div>' +
          '<div style="color:#f87171;margin-bottom:8px">' + msg + '</div>' +
          '<div style="color:rgba(255,255,255,0.5);font-size:11px">' + src + ' L' + line + ':' + col + '</div>' +
          '<div style="margin-top:24px;color:rgba(255,255,255,0.4);font-size:11px">Konsolu açın (F12) daha fazla bilgi için</div>' +
          '</div>';
      }
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.onerror(e.reason && e.reason.message || String(e.reason), 'promise', 0, 0, e.reason);
    });
  </script>

  <!-- Hide boot screen once React renders -->
  <script>
    (function() {
      var maxWait = 12000; // 12s timeout
      var started = Date.now();
      function checkReady() {
        var root = document.getElementById('root');
        var boot = document.getElementById('boot-screen');
        if (root && root.children.length > 0) {
          boot && boot.classList.add('hidden');
          setTimeout(function(){ boot && (boot.style.display = 'none'); }, 500);
        } else if (Date.now() - started < maxWait) {
          setTimeout(checkReady, 100);
        } else {
          // Timeout — hide anyway
          boot && boot.classList.add('hidden');
        }
      }
      setTimeout(checkReady, 200);
    })();
  </script>
