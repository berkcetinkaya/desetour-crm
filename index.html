  <!--
  ══════════════════════════════════════════════════════════════════════

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: 'DM Sans', -apple-system, Helvetica, Arial, sans-serif; }
    #root { height: 100%; }

    /* Loading screen shown while scripts download */
    #boot-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0D1B3E 0%, #1B2D4F 60%, #2C3E6B 100%);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; z-index: 9999;
      transition: opacity .4s ease;
    }
    #boot-screen.hidden { opacity: 0; pointer-events: none; }
    .boot-spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(201,168,76,0.25); border-top-color: #C9A84C;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .boot-text { color: rgba(248,245,238,0.6); font-size: 13px; font-family: 'DM Sans', sans-serif; }
  </style>

  <style>
    /* Responsive table — hidden on mobile, shown on desktop */
    .rsp-table { width: 100%; border-collapse: collapse; }
    @media (max-width: 767px) {
      .rsp-table { display: none !important; }
      .rsp-cards  { display: block !important; }
    }
    @media (min-width: 768px) {
      .rsp-table  { display: table !important; }
      .rsp-cards  { display: none !important; }
    }
    /* Mobile page header — stack vertically */
    @media (max-width: 767px) {
      .page-header { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
      .page-header-actions { width: 100%; justify-content: space-between; }
    }
    /* Modal responsive */
    @media (max-width: 767px) {
      .modal-inner { max-width: 100% !important; max-height: 95vh !important; margin: 0 !important; border-radius: 12px 12px 0 0 !important; }
    }
    /* Animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade { animation: fadeInUp 0.18s ease; }

    /* Dashboard hero shell height — the hero-photo box's crop ratio is its
       width (72% of this shell) divided by this height. The shell's height
       used to come from an inline minHeight:296 that never grew with the
       viewport, so on a wide screen the box got much wider without getting
       any taller, forcing object-fit:cover to zoom in far past the source
       photo's own ~2.5:1 ratio to fill it — cropping most of the image's
       height away. Growing the shell at the same breakpoints already used
       below keeps the crop close to that native ratio at every width
       instead of only at the narrowest one. */
    .hero-shell { min-height: 320px; }
    @media (min-width: 1440px) {
      .hero-shell { min-height: 340px; }
    }
    @media (min-width: 1920px) {
      .hero-shell { min-height: 430px; }
    }

    /* Dashboard hero photo — now a real <img> (object-fit) confined to the
       hero's right ~72% instead of a full-bleed background, so cover crops
       much closer to the source photo's own aspect ratio: most of its
       height shows, keeping the Bosphorus/skyline panorama wide and the
       Galata Tower at its natural size rather than blown up to fill a
       short, ultra-wide sliver. object-position keeps the tower comfortably
       in frame without clipping its spire or the rooftops below it. */
    .hero-photo { object-position: center 40%; }
    @media (min-width: 1440px) {
      .hero-photo { object-position: center 38%; }
    }
    @media (min-width: 1920px) {
      .hero-photo { object-position: center 36%; }
    }

    /* Left-to-right fade so the photo emerges from the hero's white
       background instead of a hard seam. The photo <img> itself starts at
       28% from the left (100% - 72% width), so the solid-white zone here
       extends a little past that before fading in, and is fully
       transparent well before the photo's right edge so the tower/
       architecture read crisp with no white cast over them. */
    .hero-fade {
      background: linear-gradient(to right,
        #FFFFFF 0%, #FFFFFF 34%,
        rgba(255,255,255,0.7) 45%,
        rgba(255,255,255,0.3) 56%,
        rgba(255,255,255,0.05) 63%,
        rgba(255,255,255,0) 68%);
    }
    @media (min-width: 1440px) {
      .hero-fade {
        background: linear-gradient(to right,
          #FFFFFF 0%, #FFFFFF 30%,
          rgba(255,255,255,0.65) 41%,
          rgba(255,255,255,0.28) 51%,
          rgba(255,255,255,0.04) 58%,
          rgba(255,255,255,0) 63%);
      }
    }
    @media (min-width: 1920px) {
      .hero-fade {
        background: linear-gradient(to right,
          #FFFFFF 0%, #FFFFFF 26%,
          rgba(255,255,255,0.6) 37%,
          rgba(255,255,255,0.25) 47%,
          rgba(255,255,255,0.04) 53%,
          rgba(255,255,255,0) 58%);
      }
    }
  </style>

    // Catch any JS errors and show them instead of blank screen

      var boot = document.getElementById('boot-screen');
      if (boot) {
        boot.innerHTML = '<div style="padding:40px;color:#fff;font-family:monospace;font-size:13px;max-width:800px;margin:0 auto">' +
          '<div style="color:#C9A84C;font-size:16px;margin-bottom:16px">Dese Tour — Yükleme Hatası</div>' +
          '<div style="color:#f87171;margin-bottom:8px">' + msg + '</div>' +
          '<div style="color:rgba(255,255,255,0.5);font-size:11px">' + src + ' L' + line + ':' + col + '</div>' +
          '<div style="margin-top:24px;color:rgba(255,255,255,0.4);font-size:11px">Konsolu açın (F12) daha fazla bilgi için</div>' +
          '</div>';
      }
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.onerror(e.reason && e.reason.message || String(e.reason), 'promise', 0, 0, e.reason);
    });
  </script>

  <!-- Hide boot screen once React renders -->
  <script>
    (function() {
      var maxWait = 12000; // 12s timeout
      var started = Date.now();
      function checkReady() {
        var root = document.getElementById('root');
        var boot = document.getElementById('boot-screen');
        if (root && root.children.length > 0) {
          boot && boot.classList.add('hidden');
          setTimeout(function(){ boot && (boot.style.display = 'none'); }, 500);
        } else if (Date.now() - started < maxWait) {
          setTimeout(checkReady, 100);
        } else {
          // Timeout — hide anyway
          boot && boot.classList.add('hidden');
        }
      }
      setTimeout(checkReady, 200);
    })();
  </script>
